[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wifi-audit-gui"
version = "0.1.0"
description = "GUI for authorized WPA/WPA2 handshake & PMKID capture, built on the aircrack-ng suite"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "PolyForm-Strict-1.0.0" }
authors = [{ name = "Ali Salih" }]
keywords = ["wifi", "wpa", "handshake", "pmkid", "aircrack-ng", "kali", "pentest", "security"]
classifiers = [
    "Environment :: X11 Applications",
    "Intended Audience :: Information Technology",
    "License :: Other/Proprietary License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
# No Python dependencies - only the standard library plus external CLI tools
# installed via apt (see README / install.sh).
dependencies = []

[project.urls]
Homepage = "https://github.com/AliSalih-ops/Wifi-Cracker01"
Issues = "https://github.com/AliSalih-ops/Wifi-Cracker01/issues"

[project.scripts]
wifi-audit = "wifiaudit.__main__:main"

[tool.setuptools]
packages = ["wifiaudit"]
